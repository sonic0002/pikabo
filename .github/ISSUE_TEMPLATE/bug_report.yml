name: Bug report
description: Something ext-tester does wrong, or an extension it cannot test.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most extension-testing bugs come down to something specific about the extension or the
        browser, so the environment details below matter more than usual.

        Do not paste `ext-test-results/` wholesale — screenshots and console output routinely
        contain tokens and personal data. See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: suite
    attributes:
      label: Suite that reproduces it
      description: The smallest suite that shows the problem. Trim it as far as it still fails.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: doctor
    attributes:
      label: Output of `ext-test doctor --ext .`
      description: Run it in the extension directory and paste the whole thing.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ext-tester version
      placeholder: "0.1.0, or a commit sha if running from a clone"
    validations:
      required: true

  - type: dropdown
    id: manifest
    attributes:
      label: Manifest version
      options:
        - MV3 (with a service worker)
        - MV3 (no service worker — content scripts only)
        - MV2
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which binary the run used. `doctor` prints the path.
      options:
        - Playwright's bundled Chromium (default)
        - Google Chrome (--browser-path)
        - Chrome Beta / Dev / Canary
        - Other Chromium build
    validations:
      required: true

  - type: textarea
    id: extension
    attributes:
      label: Relevant part of manifest.json
      description: >
        Usually enough on its own. Include the surfaces involved — action, options_ui, background,
        content_scripts, permissions.
      render: json

  - type: textarea
    id: failure
    attributes:
      label: Failure output
      description: >
        The failing step from `summary.md`, or the error ext-tester printed. Redact anything
        sensitive first.
      render: shell
