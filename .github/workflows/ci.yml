name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compatibility:
    # Chromium (Chrome for Testing) only. Stable Chrome stopped honouring `--load-extension` in
    # 137, and by Chrome 150 the `DisableLoadExtensionCommandLineSwitch` escape hatch is gone too,
    # so an unpacked extension cannot be loaded there at all. See the Limitations section of
    # README.md.
    name: Integration · ${{ matrix.os }} · ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: chromium
          - os: macos-latest
            channel: chromium
          - os: windows-latest
            channel: chromium
    runs-on: ${{ matrix.os }}
    env:
      PIKABO_BROWSER_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.channel }}
      - name: Install browser
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.channel }}
      - run: npm run test:integration

      - name: Self-test — explore the sample extension
        if: matrix.os == 'ubuntu-latest' && matrix.channel == 'chromium'
        run: npx tsx src/cli.ts explore --ext fixtures/sample-extension --out ci-results/sample --suite-out ci-results/smoke.yaml

      - name: Self-test — the broken extension must fail
        if: matrix.os == 'ubuntu-latest' && matrix.channel == 'chromium'
        shell: bash
        run: |
          if npx tsx src/cli.ts explore --ext fixtures/broken-extension --out ci-results/broken --suite-out ci-results/broken.yaml; then
            echo "::error::broken-extension was reported as passing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.channel == 'chromium'
        with:
          name: pikabo-reports
          path: ci-results/
